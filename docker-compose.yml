services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arqqa
      POSTGRES_USER: arqqa
      POSTGRES_PASSWORD: arqqa_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: ["./backend:/app", "modelcache:/root/.cache"]
volumes:
  pgdata:
  modelcache:
